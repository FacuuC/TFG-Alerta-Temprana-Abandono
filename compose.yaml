# Prototipo: dos contenedores (aplicación y datos), como en la Figura 9.
# La base no publica puertos: solo la alcanza la aplicación por la red interna.
name: alerta-temprana

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Solo las variables de la base (los demás secretos no entran a este contenedor).
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos_db:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      RUTA_MODELOS: /app/modelos
      RUTA_DATOS: /app/data
      RUTA_REPORTES: /app/reportes
    volumes:
      # Modelos versionados: se entrenan con los scripts y la aplicación solo los lee.
      - ./modelos:/app/modelos:ro
    # Entorno de demostración: solo en la interfaz local del equipo anfitrión. Sin inicio de
    # sesión (HU-009), la plataforma no debe quedar accesible desde otras computadoras.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna
      - frontal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  interna:
    internal: true
  frontal:

volumes:
  datos_db:
